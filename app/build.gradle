plugins {
    id 'com.android.application'
    id 'org.jetbrains.kotlin.android'
}

// Version is injected by CI (see .github/workflows/release.yml):
//   ./gradlew assembleRelease -PversionCode=1042 -PversionName=1.0.42
def appVersionCode = (findProperty('versionCode') ?: '1').toString().toInteger()
def appVersionName = (findProperty('versionName') ?: '1.0.0').toString()

// Optional release signing. When the keystore is not supplied (e.g. a fork without
// secrets) the release APK is signed with the debug key so it is still installable.
def keystorePath = findProperty('MDC_KEYSTORE_FILE') ?: System.getenv('MDC_KEYSTORE_FILE')
def hasReleaseKeystore = keystorePath != null && !keystorePath.toString().trim().isEmpty() && file(keystorePath).exists()

// Depodaki sabit yedek anahtar. CI her calismada yeni bir debug anahtari
// urettigi icin surumler farkli imzalanip uygulama ici guncelleme "paket
// çakıştı" hatasi veriyordu; bu anahtar tum yedek derlemelerde ayni imzayi
// garanti eder, boylece yeni APK eskisinin uzerine kurulur.
def fallbackKeystore = rootProject.file('keystore/mdc-fallback.keystore')

android {
    namespace 'com.mdc.vpn'
    compileSdk 34

    defaultConfig {
        applicationId 'com.mdc.vpn'
        // Android 5.0 ve uzeri: Samsung Note 5 gibi eski cihazlar da kurulum yapabilir.
        minSdk 21
        targetSdk 34
        versionCode appVersionCode
        versionName appVersionName
        vectorDrawables.useSupportLibrary = true

        // ByeDPI ikilileri 3 ABI icin derlendi; hev-socks5-tunnel AAR'i de ayni
        // kumeyle sinirlanir.
        ndk {
            abiFilters 'armeabi-v7a', 'arm64-v8a', 'x86_64'
        }
    }

    signingConfigs {
        debug {
            if (fallbackKeystore.exists()) {
                storeFile fallbackKeystore
                storePassword 'mdcvpn1234'
                keyAlias 'mdc'
                keyPassword 'mdcvpn1234'
            }
        }
        release {
            if (hasReleaseKeystore) {
                storeFile file(keystorePath)
                storePassword findProperty('MDC_KEYSTORE_PASSWORD') ?: System.getenv('MDC_KEYSTORE_PASSWORD')
                keyAlias findProperty('MDC_KEY_ALIAS') ?: System.getenv('MDC_KEY_ALIAS')
                keyPassword findProperty('MDC_KEY_PASSWORD') ?: System.getenv('MDC_KEY_PASSWORD')
            }
        }
    }

    buildTypes {
        debug {
            applicationIdSuffix '.debug'
            versionNameSuffix '-debug'
        }
        release {
            // The ics-openvpn / OVPN3 core reaches Kotlin code from native code and
            // instantiates the notification class through reflection. Keeping R8 off
            // avoids breaking those entry points; proguard-rules.pro is prepared if
            // you want to enable shrinking later.
            minifyEnabled false
            shrinkResources false
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
            signingConfig hasReleaseKeystore ? signingConfigs.release : signingConfigs.debug
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }

    kotlinOptions {
        jvmTarget = '17'
        freeCompilerArgs += ['-Xjvm-default=all']
    }

    buildFeatures {
        viewBinding true
    }

    packaging {
        // ciadpi, APK icinden cikarilip nativeLibraryDir'den calistirilir.
        jniLibs {
            useLegacyPackaging = true
        }
        resources {
            excludes += [
                    'META-INF/DEPENDENCIES',
                    'META-INF/LICENSE',
                    'META-INF/LICENSE.txt',
                    'META-INF/NOTICE',
                    'META-INF/NOTICE.txt'
            ]
        }
    }

    lint {
        abortOnError false
    }
}

dependencies {
    implementation 'androidx.core:core-ktx:1.13.1'
    implementation 'androidx.appcompat:appcompat:1.7.0'
    implementation 'androidx.activity:activity-ktx:1.9.1'
    implementation 'androidx.lifecycle:lifecycle-runtime-ktx:2.8.4'
    implementation 'androidx.lifecycle:lifecycle-service:2.8.4'
    implementation 'com.google.android.material:material:1.12.0'
    implementation 'org.jetbrains.kotlinx:kotlinx-coroutines-android:1.8.1'

    // OpenVPN 3 (ics-openvpn core) for Android: VpnService implementation,
    // OVPN3 native engine and the AIDL state callbacks.
    implementation 'io.github.tim06:openvpn:1.1.3'

    // hev-socks5-tunnel: tun dosya tanimlayicisini yerel SOCKS5'e baglar.
    // Maven'de yok; GitHub surumunden alinan hazir AAR projeye eklendi.
    implementation files('libs/hev-socks5-tunnel.aar')

    // WireGuard (userspace wireguard-go): ikinci protokol secenegi.
    // VpnService bilesenini kendi manifestinden birlestirir.
    implementation 'com.wireguard.android:tunnel:1.0.20230706'
}
