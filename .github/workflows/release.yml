name: Build & Release APK

on:
  push:
    branches: [ main ]
  workflow_dispatch:

# Releases API'sine yazabilmek icin gerekli izin.
permissions:
  contents: write

concurrency:
  group: release-main
  cancel-in-progress: false

jobs:
  release:
    name: Build signed APK
    runs-on: ubuntu-latest

    # `secrets` cannot be referenced in a step-level `if:` expression, so the
    # presence of the keystore is evaluated once here and reused below.
    env:
      HAS_KEYSTORE: ${{ secrets.KEYSTORE_BASE64 != '' }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v3

      - name: Make gradlew executable
        run: chmod +x ./gradlew

      # Her push'ta artan surum numarasi: v1.0.1, v1.0.2, ...
      - name: Compute version
        id: version
        run: |
          VERSION_CODE=$((1000 + GITHUB_RUN_NUMBER))
          VERSION_NAME="1.0.${GITHUB_RUN_NUMBER}"
          echo "code=${VERSION_CODE}" >> "$GITHUB_OUTPUT"
          echo "name=${VERSION_NAME}" >> "$GITHUB_OUTPUT"
          echo "tag=v${VERSION_NAME}" >> "$GITHUB_OUTPUT"

      # Opsiyonel imzalama: KEYSTORE_BASE64 tanimliysa gercek anahtar kullanilir,
      # aksi halde APK debug anahtariyla imzalanir ve yine de kurulabilir olur.
      - name: Decode release keystore
        if: env.HAS_KEYSTORE == 'true'
        run: |
          echo "${{ secrets.KEYSTORE_BASE64 }}" | base64 --decode > release.keystore
          if [ ! -s release.keystore ]; then
            echo "::error::KEYSTORE_BASE64 cozulemedi. Secret'i tek satirlik base64 metni olarak kontrol edin."
            exit 1
          fi
          ls -l release.keystore

      - name: Build release APK
        env:
          MDC_KEYSTORE_FILE: ${{ env.HAS_KEYSTORE == 'true' && 'release.keystore' || '' }}
          MDC_KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          MDC_KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          MDC_KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        run: |
          ./gradlew --no-daemon assembleRelease \
            -PversionCode=${{ steps.version.outputs.code }} \
            -PversionName=${{ steps.version.outputs.name }}

      - name: Rename APK
        run: |
          mkdir -p dist
          cp app/build/outputs/apk/release/app-release.apk dist/MDC-VPN.apk

      - name: Upload build artifact
        uses: actions/upload-artifact@v4
        with:
          name: MDC-VPN-${{ steps.version.outputs.name }}
          path: dist/MDC-VPN.apk
          if-no-files-found: error

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.version.outputs.tag }}
          name: MDC VPN ${{ steps.version.outputs.name }}
          generate_release_notes: true
          files: dist/MDC-VPN.apk
